name: Update profile
on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
  push:
    paths:
      - 'config/**'
      - 'templates/**'
      - 'scripts/**'
      - 'design/tokens.json'
      - 'package*.json'
      - '.node-version'
permissions:
  contents: read
concurrency:
  group: profile-update
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'jacky105402002/jacky105402002' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
      - run: npm run update
        env:
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN || github.token }}
      - run: npm run check:generated
      - name: Commit generated files only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git diff --quiet -- README.md data/public-snapshot.json assets/generated && exit 0
          base="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          test "$base" = "$remote" || { echo "Default branch changed; rerun from latest commit."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md data/public-snapshot.json assets/generated/hero.svg assets/generated/activity.svg assets/generated/streak.svg assets/generated/languages.svg assets/generated/monthly.svg assets/generated/calendar.svg
          git commit -m "Update profile cards"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
